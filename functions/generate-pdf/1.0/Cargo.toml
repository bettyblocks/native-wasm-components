[package]
name = "generate-pdf"
edition = "2024"
version = "1.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
fullbleed = "=2.5.34"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
html-escape = "0.2"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["visitor"] }
liquid = "0.26"
liquid-core = { version = "0.26", features = ["derive"] }
lol_html = "2"
serde_json = "1"
url = "2.5"
wit-bindgen = "0.47.0"
wstd = "=0.6.5"
wuff = "0.2.9"

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }

# fullbleed plus eight embedded fonts: keep the component small.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
