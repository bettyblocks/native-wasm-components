name: Version Check

on:
  pull_request:

jobs:
  check-version-bumps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so we can diff against the base branch
          fetch-depth: 0

      - name: Check component version bumps
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash ./scripts/check-version-bumps.sh
